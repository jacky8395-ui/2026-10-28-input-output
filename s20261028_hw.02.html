<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和弦辨識練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf9f6;
  --paper-2:#f2f0EA;
  --ink:#1c1c1a;
  --ink-2:#55544e;
  --mute:#8a8880;
  --line:#d9d6cc;
  --vermilion:#b8432f;
  --ok:#2f6b4f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-weight:400;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* 頂部導覽 */
header{
  height:72px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 56px;position:sticky;top:0;background:var(--paper);z-index:5;
}
.brand{font-size:15px;letter-spacing:.2em}
.brand span{color:var(--mute);margin-left:12px;letter-spacing:.08em;font-size:13px}
.nav{display:flex;gap:28px;font-size:14px;color:var(--ink-2)}
.nav button:hover{color:var(--ink)}
.nav .current{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px}

main{max-width:1120px;margin:0 auto;padding:72px 56px 96px}

/* 首頁 */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:88px}
.hero h1{font-size:44px;font-weight:500;line-height:1.35;margin:0;letter-spacing:.02em}
.hero p{color:var(--ink-2);margin:0;font-size:15px;max-width:420px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--mute);margin-bottom:18px;display:block}

.index{border-top:1px solid var(--ink)}
.index-row{
  display:grid;grid-template-columns:90px 1fr 120px 40px;align-items:center;gap:24px;
  padding:34px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;
  transition:padding .25s;
}
.index-row:hover{padding-left:12px}
.index-row .no{font-size:13px;color:var(--mute);letter-spacing:.1em}
.index-row h2{margin:0;font-size:26px;font-weight:500;letter-spacing:.04em}
.index-row p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.index-row .meta{font-size:13px;color:var(--mute);text-align:right}
.index-row .arrow{font-size:20px;text-align:right}

.rules{display:flex;gap:40px;margin-top:40px;font-size:13px;color:var(--mute)}

/* 練習頁 */
.crumb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:48px;font-size:13px;color:var(--mute)}
.crumb b{color:var(--ink);font-weight:400}
.practice{display:grid;grid-template-columns:1.05fr 1fr;gap:88px;align-items:start}

.stage{border:1px solid var(--line);background:var(--paper);padding:40px 32px 28px;position:relative}
.stage-top{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);letter-spacing:.12em;margin-bottom:12px}
.stage svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.chord-name{font-size:13px;color:var(--mute);text-align:center;margin-top:18px;letter-spacing:.1em}

.q{display:flex;flex-direction:column;min-height:100%}
.q-label{font-size:12px;color:var(--mute);letter-spacing:.14em}
.q h2{font-size:34px;font-weight:500;margin:10px 0 36px;letter-spacing:.04em;line-height:1.3}
.mode{font-size:13px;color:var(--ink-2);margin-bottom:32px;padding-bottom:14px;border-bottom:1px solid var(--line)}

.opts{border-top:1px solid var(--ink)}
.opt{
  display:grid;grid-template-columns:48px 1fr auto;align-items:center;
  width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line);
  transition:background .2s,padding .2s;
}
.opt:not(:disabled):hover{padding-left:10px;background:var(--paper-2)}
.opt .l{font-size:13px;color:var(--mute);letter-spacing:.1em}
.opt .n{font-size:24px;font-weight:500;letter-spacing:.02em}
.opt .tag{font-size:12px;color:var(--mute)}
.opt.sel{background:var(--paper-2);padding-left:10px}
.opt.sel .l{color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right .n{color:var(--ok)}
.opt.right .tag{color:var(--ok)}
.opt.wrong .n{color:var(--vermilion)}
.opt.wrong .tag{color:var(--vermilion)}
.opt.dim .n{color:var(--mute)}

.actions{display:flex;justify-content:space-between;align-items:center;margin-top:36px}
.hint{font-size:13px;color:var(--mute)}
.btn{
  display:inline-flex;align-items:center;gap:14px;
  padding:14px 30px;font-size:14px;letter-spacing:.14em;
  background:var(--ink);color:var(--paper);transition:opacity .2s;
}
.btn:disabled{background:var(--line);color:var(--paper);cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn:not(:disabled):hover{opacity:.85}

.feedback{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.verdict{font-size:20px;font-weight:500;margin:0 0 8px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--vermilion)}
.feedback p{margin:0;color:var(--ink-2);font-size:14px}
.feedback .notes{margin-top:14px;font-size:13px;color:var(--mute);letter-spacing:.06em}

footer{border-top:1px solid var(--line);padding:28px 56px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}

@media (max-width:900px){
  header{padding:0 24px}
  main{padding:48px 24px 72px}
  .hero{grid-template-columns:1fr;gap:28px;margin-bottom:56px}
  .hero h1{font-size:32px}
  .practice{grid-template-columns:1fr;gap:48px}
  .index-row{grid-template-columns:50px 1fr 40px}
  .index-row .meta{display:none}
  footer{padding:24px}
}
</style>
</head>
<body>

<header>
  <div class="brand">和弦辨識<span>CHORD PRACTICE</span></div>
  <nav class="nav">
    <button id="navHome" class="current">主頁面</button>
    <button id="navPractice" class="hidden">練習中</button>
  </nav>
</header>

<main>
  <!-- 首頁 -->
  <section id="home">
    <div class="hero">
      <div>
        <h1>和弦辨識</h1>
      </div>
    </div>

    <div class="index">
      <button class="index-row" data-level="beginner">
        <span class="no">01</span>
        <span><h2>初級</h2><p>常用開放和弦，僅包含自然音（C D E F G A B）。</p></span>
        <span class="meta">約 22 種指型</span>
        <span class="arrow">→</span>
      </button>
      <button class="index-row" data-level="advanced">
        <span class="no">02</span>
        <span><h2>進階</h2><p>大橫按與移動指型，包含升降記號（# ）。</p></span>
        <span class="meta">移動指型</span>
        <span class="arrow">→</span>
      </button>
    </div>
  </section>

  <!-- 練習頁 -->
  <section id="practice" class="hidden">
    <div class="crumb">
      <span><button id="crumbHome" style="color:var(--mute)">主頁面</button> ／ <b id="crumbLevel"></b></span>
      <span id="countText"></span>
    </div>

    <div class="practice">
      <div class="stage">
        <div class="stage-top"><span>指型圖</span><span>由低音 E 弦起算</span></div>
        <div id="board"></div>
        <div class="chord-name" id="chordHint"></div>
      </div>

      <div class="q">
        <div class="q-label" id="modeLabel"></div>
        <h2>這是什麼和弦？</h2>
        <div class="mode">不計分・無限循環練習</div>

        <form id="form">
          <div class="opts" id="opts"></div>
          <div class="actions">
            <span class="hint" id="hint">請選擇一個答案</span>
            <button type="submit" class="btn" id="submitBtn" disabled>送出</button>
          </div>
        </form>

        <div id="feedback" class="feedback hidden"></div>
        <div id="nextRow" class="actions hidden" style="justify-content:flex-end">
          <button class="btn" id="nextBtn">下一題 →</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <span>和弦辨識練習</span>
  <span>不計分・無限循環</span>
</footer>

<script>
const OPEN  = [4, 9, 2, 7, 11, 4];
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NATURAL = ["C","D","E","F","G","A","B"];
const LETTERS = ["a","b","c","d"];

const BEGINNER_SHAPES = [
  ["C",[null,3,2,0,1,0]],["G",[3,2,0,0,0,3]],["G",[3,2,0,0,3,3]],["D",[null,null,0,2,3,2]],
  ["D7",[null,null,0,2,1,2]],["A",[null,0,2,2,2,0]],["A7",[null,0,2,0,2,0]],["E",[0,2,2,1,0,0]],
  ["E7",[0,2,0,1,0,0]],["Em",[0,2,2,0,0,0]],["Em7",[0,2,0,0,0,0]],["Am",[null,0,2,2,1,0]],
  ["Am7",[null,0,2,0,1,0]],["Dm",[null,null,0,2,3,1]],["Dm7",[null,null,0,2,1,1]],["C7",[null,3,2,3,1,0]],
  ["G7",[3,2,0,0,0,1]],["Cadd9",[null,3,2,0,3,0]],["Gsus4",[3,3,0,0,1,3]],["Asus4",[null,0,2,2,3,0]],
  ["Dsus2",[null,null,0,2,3,0]],["Fmaj7",[null,null,3,2,1,0]],["F",[null,null,3,2,1,1]]
];

const MOVABLE = [
  {shape:f=>[f,f+2,f+2,f+1,f,f],    root:4, q:""},
  {shape:f=>[f,f+2,f+2,f,f,f],      root:4, q:"m"},
  {shape:f=>[f,f+2,f,f+1,f,f],      root:4, q:"7"},
  {shape:f=>[null,f,f+2,f+2,f+2,f], root:9, q:""},
  {shape:f=>[null,f,f+2,f+2,f+1,f], root:9, q:"m"},
  {shape:f=>[null,f,f+2,f,f+2,f],   root:9, q:"7"}
];

function shuffle(a){
  const arr=[...a];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function chordNotes(frets){
  const set=new Set();
  frets.forEach((f,s)=>{ if(f!==null) set.add(NOTES[(OPEN[s]+f)%12]); });
  return [...set];
}
function makeBank(items){
  const pool=[...new Set(items.map(i=>i.name))];
  return items.map(it=>{
    const others=shuffle(pool.filter(n=>n!==it.name));
    const opts=shuffle([it.name,...others.slice(0,3)]);
    return {...it,opts,ans:opts.indexOf(it.name)};
  });
}
const BANK={
  beginner: makeBank(BEGINNER_SHAPES.map(([name,frets])=>({name,frets}))),
  advanced: makeBank(shuffle(
    MOVABLE.flatMap(m=>{
      const out=[];
      for(let f=0;f<=9;f++) out.push({name:NOTES[(m.root+f)%12]+m.q, frets:m.shape(f)});
      return out;
    })
  ).slice(0,50))
};

/* 指板 SVG：細線、墨黑，無紅點 */
function boardSVG(frets){
  const pos=frets.filter(f=>f>0);
  const maxF=pos.length?Math.max(...pos):1;
  const minF=pos.length?Math.min(...pos):1;
  const start=maxF<=5?0:minF-1;
  const x0=44, dx=46, top=64, cell=42, bottom=top+5*cell;
  const LINE="#d9d6cc", STR="#8a8880", INK="#1c1c1a", MUTE="#8a8880";

  let s=`<svg viewBox="0 0 330 ${bottom+40}" role="img" aria-label="和弦指型圖">`;
  for(let k=0;k<=5;k++){
    const y=top+k*cell, nut=(k===0&&start===0);
    s+=`<line x1="${x0-8}" y1="${y}" x2="${x0+5*dx+8}" y2="${y}" stroke="${nut?INK:LINE}" stroke-width="${nut?3:1}"/>`;
  }
  if(start>0) s+=`<text x="6" y="${top+cell*0.6}" font-size="12" fill="${MUTE}">${start+1}品</text>`;
  for(let i=0;i<6;i++){
    const x=x0+i*dx;
    s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="${STR}" stroke-width="${0.6+ (5-i)*0.12}"/>`;
  }
  frets.forEach((f,i)=>{
    const x=x0+i*dx;
    if(f===null) s+=`<text x="${x}" y="${top-16}" text-anchor="middle" font-size="16" fill="${MUTE}">×</text>`;
    else if(f===0){ if(start===0) s+=`<circle cx="${x}" cy="${top-18}" r="6" fill="none" stroke="${MUTE}" stroke-width="1"/>`; }
    else if(f>=start+1 && f<=start+5){
      const y=top+(f-start-0.5)*cell;
      s+=`<circle cx="${x}" cy="${y}" r="11" fill="${INK}"/>`;
    }
  });
  s+=`</svg>`;
  return s;
}

/* 狀態 */
let state={level:null, deck:[], cur:null, count:0, answered:false, pick:null};
const $=id=>document.getElementById(id);
const form=$('form'), submitBtn=$('submitBtn');

function show(view){
  $('home').classList.toggle('hidden',view!=='home');
  $('practice').classList.toggle('hidden',view!=='practice');
  $('navHome').classList.toggle('current',view==='home');
  $('navPractice').classList.toggle('hidden',view!=='practice');
  $('navPractice').classList.toggle('current',view==='practice');
  window.scrollTo({top:0,behavior:'smooth'});
}

function drawNext(){
  if(state.deck.length===0){
    const bank=shuffle(BANK[state.level]);
    if(state.cur && bank[0].name===state.cur.name && bank.length>1) [bank[0],bank[1]]=[bank[1],bank[0]];
    state.deck=bank;
  }
  return state.deck.pop();
}

function start(level){
  state={level, deck:[], cur:null, count:0, answered:false, pick:null};
  $('crumbLevel').textContent = level==='beginner' ? '初級' : '進階';
  $('modeLabel').textContent = level==='beginner' ? '初級｜開放和弦（自然音）' : '進階｜移動指型・大橫按';
  show('practice');
  next();
}

function next(){
  state.cur=drawNext();
  state.answered=false; state.pick=null;
  const q=state.cur;
  $('countText').textContent=`已練習 ${state.count} 題`;
  $('board').innerHTML=boardSVG(q.frets);
  $('chordHint').textContent='';
  $('opts').innerHTML=q.opts.map((n,i)=>
    `<button type="button" class="opt" data-i="${i}"><span class="l">${LETTERS[i]}</span><span class="n">${n}</span><span class="tag"></span></button>`
  ).join('');
  submitBtn.disabled=true;
  $('hint').textContent='請選擇一個答案';
  $('feedback').classList.add('hidden');
  $('nextRow').classList.add('hidden');
}

// 點選項：單選，之後才能送出
$('opts').addEventListener('click',e=>{
  const btn=e.target.closest('.opt');
  if(!btn||state.answered) return;
  state.pick=Number(btn.dataset.i);
  $('opts').querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel', b===btn));
  submitBtn.disabled=false;
  $('hint').textContent='按「送出」確認答案';
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(state.answered || state.pick===null) return;
  state.answered=true;
  state.count++;
  const q=state.cur, pick=state.pick, ok=pick===q.ans;

  const btns=$('opts').querySelectorAll('.opt');
  btns.forEach((b,i)=>{
    b.disabled=true; b.classList.remove('sel');
    if(i===q.ans) b.classList.add('right');
    else if(i===pick && !ok) b.classList.add('wrong');
    else b.classList.add('dim');
    b.querySelector('.tag').textContent = i===q.ans ? '正確' : (i===pick ? '你的答案' : '');
  });
  submitBtn.disabled=true;
  $('hint').textContent='';
  $('countText').textContent=`已練習 ${state.count} 題`;

  const notes=chordNotes(q.frets).join('、');
  $('feedback').innerHTML=`
    <p class="verdict ${ok?'ok':'bad'}">${ok?'答對了':'答錯了'}</p>
    <p>${ok ? `這是 <b style="font-weight:500">${q.name}</b>。`
            : `你選的是 ${q.opts[pick]}，正確答案是 <b style="font-weight:500">${q.name}</b>。`}</p>
    <div class="notes">組成音　${notes}</div>`;
  $('feedback').classList.remove('hidden');
  $('nextRow').classList.remove('hidden');
});

$('nextBtn').addEventListener('click',next);
$('navHome').addEventListener('click',()=>show('home'));
$('crumbHome').addEventListener('click',()=>{ state={level:null,deck:[],cur:null,count:0,answered:false,pick:null}; show('home'); });
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.level)));
</script>
</body>
</html>
